name: Build Windows App

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag (e.g. v1.0.0)
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Grants permission to create GitHub Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Run Windows build
        run: npm run build:win

      # Step A: Isolate only the .exe from the hardcoded output directory
      - name: Clean up extra build files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "final-exe"
          Get-ChildItem -Path "dist/windows/portable" -File -Filter "*.exe" | Copy-Item -Destination "final-exe"

      # Step B: Upload Artifact
      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AriYouLive-Windows-Executable
          path: final-exe/

      # Step C: Create GitHub Release (attaches only the portable .exe)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            final-exe/*
