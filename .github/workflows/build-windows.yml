name: Build Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Change to your preferred Node version if needed

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # PyInstaller works reliably on modern Python versions

      - name: Install Node dependencies
        run: npm install[cite: 2]

      - name: Install PyInstaller
        run: pip install pyinstaller[cite: 2]

      - name: Run Windows build
        run: npm run build:win[cite: 2]

      - name: Upload portable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AriYouLive-Windows-Portable
          path: dist/windows/portable/[cite: 2]
